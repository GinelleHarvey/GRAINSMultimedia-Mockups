<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="260" viewBox="0 0 1100 260" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">THE 386 EXCHANGE</title>
  <desc id="logoDesc">Three connected circles representing people, resources, and opportunities, followed by the name THE 386 EXCHANGE and its tagline.</desc>

  <!-- Transparent background -->
  <g id="connection-mark">
    <!-- Three intentionally different circle sizes -->
    <circle cx="116" cy="136" r="78" fill="#17324D"/>
    <circle cx="184" cy="77" r="43" fill="#147D74" stroke="#FBFAF7" stroke-width="8"/>
    <circle cx="194" cy="176" r="29" fill="#E86452" stroke="#FBFAF7" stroke-width="8"/>

    <!-- Local-root identifier inside the largest circle -->
    <text x="112" y="153" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" text-anchor="middle" letter-spacing="-2">386</text>
  </g>

  <g id="wordmark" font-family="Arial, Helvetica, sans-serif">
    <text x="280" y="78" fill="#F2B84B" font-size="25" font-weight="700" letter-spacing="8">THE</text>
    <text x="280" y="147" fill="#17324D" font-size="66" font-weight="700" letter-spacing="1">386</text>
    <text x="421" y="147" fill="#147D74" font-size="66" font-weight="700" letter-spacing="1">EXCHANGE</text>
    <text x="283" y="194" fill="#637381" font-size="24" font-weight="400" letter-spacing="0.2">Connecting people, resources, and opportunities.</text>
  </g>
</svg>
